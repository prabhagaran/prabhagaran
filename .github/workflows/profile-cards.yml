name: Profile cards

on:
  schedule:
    - cron: "17 1 * * *"   # daily, 06:47 IST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/gen_cards.py
      - .github/workflows/profile-cards.yml

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate cards
        env:
          # Optional: add a classic PAT (read:user, repo) as METRICS_TOKEN
          # to include private-repo languages. Falls back to GITHUB_TOKEN.
          GH_TOKEN: ${{ secrets.METRICS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python scripts/gen_cards.py --user "${{ github.repository_owner }}" --out assets

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/*.svg
          git diff --cached --quiet || git commit -m "chore: refresh profile cards"
          git push
